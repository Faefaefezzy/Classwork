<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Application Workspace</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        iframe { border: none; width: 100%; height: 100vh; margin: 0; padding: 0; display: block; }
    </style>
</head>
<body>

    <!-- This streams the full 1.8.8 client directly via the jsDelivr premium development network -->
    <iframe src="https://jsdelivr.net" 
            allow="fullscreen; autoplay; gamepad;" 
            allowfullscreen>
    </iframe>

</body>
</html>
